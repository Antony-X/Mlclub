<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>სახე → ემოჯი</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4">
    <path d="M6 8 16 6M6 8l10 10M6 24l10-18M6 24l10-6M16 6l10 10M16 18l10-2M16 28l10-12M6 24l10 4"/>
    <g fill="#111316"><circle cx="6" cy="8" r="3"/><circle cx="6" cy="24" r="3"/><circle cx="16" cy="6" r="3"/><circle cx="16" cy="18" r="3"/><circle cx="16" cy="28" r="3"/></g>
    <circle cx="26" cy="16" r="3.4" fill="#e7c46b" stroke="#e7c46b"/>
  </svg>
  <span class="club">მანქანური სწავლების კლუბი</span>
  <span class="title">სახე → ემოჯი</span>
  <span class="privacy">არაფერი იწერება და არსად იგზავნება.</span>
  <a href="index.html">მენიუ</a>
</header>
<main class="emoji-main">
  <div class="stage">
    <canvas id="view" width="960" height="540"></canvas>
    <div class="fps" id="fps"></div>
    <div class="overlay" id="msg">იტვირთება…</div>
  </div>
  <div class="side">
    <div class="box now" id="now">
      <div class="target"><div class="lbl">გაიმეორე</div><div class="t emoji" id="target"></div></div>
      <div class="arrow">←</div>
      <div class="current emoji" id="current">😐</div>
    </div>
    <div class="hud">
      <div class="box stat time"><div class="lbl">დრო</div><div class="val" id="time">–</div></div>
      <div class="box stat"><div class="lbl">ქულა</div><div class="val" id="score">0</div></div>
    </div>
    <div class="box bars" id="bars"></div>
    <div class="box collection">
      <div class="head"><span>შეგროვებული</span><b id="count">0 / 0</b></div>
      <div class="grid emoji" id="grid"></div>
    </div>
    <div class="actions">
      <button class="primary" id="play">თამაში<kbd>Space</kbd></button>
      <button id="reset">თავიდან<kbd>R</kbd></button>
    </div>
  </div>
</main>
<video id="cam" playsinline muted hidden></video>
<script type="module" src="app/emoji.js"></script>
</body>
</html>
