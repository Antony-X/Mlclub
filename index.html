<body data-route="menu">
<header class="top">
  <a class="back" href="#/" aria-label="მენიუ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </a>
  <svg class="logo" viewBox="14 54 408 296" fill="none" stroke="currentColor" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M52 312 L52 92 L146 222 L240 92 L240 312" /><path d="M312 92 L312 312 L384 312" /><circle cx="52" cy="312" r="25" stroke-width="13"/><circle cx="52" cy="92" r="25" stroke-width="13"/><circle class="you" cx="146" cy="222" r="25" stroke-width="13"/><circle cx="240" cy="92" r="25" stroke-width="13"/><circle cx="240" cy="312" r="25" stroke-width="13"/><circle cx="312" cy="92" r="25" stroke-width="13"/><circle cx="312" cy="312" r="25" stroke-width="13"/><circle cx="384" cy="312" r="25" stroke-width="13"/></svg>
  <h1 class="title" id="title">მანქანური სწავლების კლუბი</h1>
  <span class="privacy" id="privacy">ვიდეო არ იწერება და არსად იგზავნება.</span>
  <div class="tools">
    <button class="tool sun" id="sun" type="button" aria-label="ნათელი ფონი" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <g class="rays"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
        <path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
    <button class="tool rec" id="rec" type="button" aria-label="ვიდეოს ჩაწერა" aria-pressed="false" hidden><i></i><span class="num" id="rec-time"></span></button>
  </div>
</header>

<main id="view"></main>

<div class="gate" id="gate" hidden>
  <div class="gate-box">
    <p class="gate-msg" id="gate-msg"></p>
    <div class="meter" id="gate-meter"><i></i></div>
    <button class="btn primary" id="gate-retry" hidden>თავიდან ცდა</button>
    <p class="gate-sub">ვიდეო არ იწერება და არსად იგზავნება.</p>
  </div>
</div>

<video id="cam" class="cam-src" playsinline muted autoplay></video>
<script type="module" src="app/main.js"></script>
</body>
