<!doctype html>
<meta charset="utf-8">
<title>blendshape extractor</title>
<canvas id="c"></canvas>
<script type="module">
// Runs still photos through the same model and options the games use
// (app/core.js), on the CPU delegate, and returns the numbers the rules read.
import { FaceLandmarker, GestureRecognizer, FilesetResolver } from '../../vendor/mediapipe/vision_bundle.mjs';
import { geometry } from '../../app/rules.js';
import { anchor } from '../../app/hands.js';

const VENDOR = new URL('../../vendor/mediapipe/', import.meta.url);
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const round = (x) => Math.round(x * 1e4) / 1e4;
let lm = null, gr = null, fileset = null, stamp = 0;

async function init() {
  fileset = await FilesetResolver.forVisionTasks(new URL('wasm', VENDOR).href);
  lm = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: new URL('face_landmarker.task', VENDOR).href, delegate: 'CPU' },
    runningMode: 'VIDEO',
    numFaces: 3,
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true,
  });
}
const ready = init();

// The hand model, as core.js sets it up; made on first use.
async function hands() {
  gr = gr || await GestureRecognizer.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: new URL('gesture_recognizer.task', VENDOR).href, delegate: 'CPU' },
    runningMode: 'VIDEO',
    numHands: 2,
  });
  let r = null;
  for (let i = 0; i < 4; i++) r = gr.recognizeForVideo(canvas, (stamp += 40));
  return (r.landmarks || []).map((marks, i) => {
    const g = r.gestures && r.gestures[i] && r.gestures[i][0], h = r.handedness && r.handedness[i] && r.handedness[i][0];
    return {
      landmarks: marks.map((p) => ({ x: round(p.x), y: round(p.y), z: round(p.z) })),
      handed: h ? (h.categoryName === 'Left' ? 'Right' : 'Left') : '',     // swapped, as in core.js
      gesture: g ? g.categoryName || 'None' : 'None', score: g ? round(g.score) : 0,
    };
  });
}

function summarise(r, w, h) {
  const faces = r.faceLandmarks || [];
  if (!faces.length || !r.faceBlendshapes || !r.faceBlendshapes.length) return null;
  let best = 0, bestArea = -1, box = null;                       // the largest face, as in core.js
  faces.forEach((pts, i) => {
    let x0 = 1, x1 = 0, y0 = 1, y1 = 0;
    for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    const area = (x1 - x0) * (y1 - y0);
    if (area > bestArea) { bestArea = area; best = i; box = { x0, y0, x1, y1 }; }
  });
  const raw = {};
  for (const c of r.faceBlendshapes[best].categories) raw[c.categoryName] = round(c.score);
  const a = faces[best][33], b = faces[best][263];
  const roll = Math.atan2((b.y - a.y) * h, (b.x - a.x) * w) * 180 / Math.PI;
  const m = r.facialTransformationMatrixes && r.facialTransformationMatrixes[best];
  return {
    raw, geo: geometry(faces[best], w / h), anchor: anchor(faces[best], w / h), roll: Math.round(roll * 100) / 100, matrix: m ? Array.from(m.data, round) : null,
    box: Object.fromEntries(Object.entries(box).map(([k, v]) => [k, round(v)])), faces: faces.length,
  };
}

// One pass over a rectangle of the photo (source pixels), scaled so its long
// side is at most maxSide (a camera frame is 640 to 1280 wide).
async function pass(img, [sx, sy, sw, sh], opts) {
  const k = Math.min(2, (opts.maxSide || 1280) / Math.max(sw, sh));
  const w = Math.round(sw * k), h = Math.round(sh * k);
  canvas.width = w;
  canvas.height = h;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);
  if (!opts.keep) lm.detectForVideo(canvas, (stamp += 40));   // a blank frame empties the tracker
  if (opts.rotate) {
    ctx.translate(w / 2, h / 2);
    ctx.rotate(opts.rotate * Math.PI / 180);
    ctx.translate(-w / 2, -h / 2);
  }
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let out = null;
  for (let i = 0; i < (opts.repeat || 5); i++) out = summarise(lm.detectForVideo(canvas, (stamp += 40)), w, h);
  if (!opts.hands) return out && { ...out, w, h };
  const list = await hands();
  return out || list.length ? { ...(out || { found: false }), hands: list, w, h } : null;
}

// url: the photo. opts: maxSide, rotate (degrees, to test tilted heads), keep
// (no blank frame first, for a sequence), repeat (frames shown, as a video would),
// crop ([x0, y0, x1, y1] in 0..1), tiles (if the whole photo shows no face, look
// in parts of it: the detector only finds faces that are large in the picture),
// hands (also run the hand model and return its hands, with or without a face).
window.extract = async (url, opts = {}) => {
  await ready;
  const img = new Image();
  img.src = url;
  await img.decode();
  const W = img.naturalWidth, H = img.naturalHeight;
  const rect = (c) => [c[0] * W, c[1] * H, (c[2] - c[0]) * W, (c[3] - c[1]) * H];
  if (opts.crop) return pass(img, rect(opts.crop), opts);
  let out = await pass(img, [0, 0, W, H], opts);
  if (out || !opts.tiles) return out;
  for (const size of [0.6, 0.35]) {
    const n = Math.round(1 / size) + 1;
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const x0 = (1 - size) * i / (n - 1), y0 = (1 - size) * j / (n - 1);
      const crop = [x0, y0, x0 + size, y0 + size].map(round);
      out = await pass(img, rect(crop), opts);
      if (out) return { ...out, crop };
    }
  }
  return null;
};
window.ready = ready.then(() => true);
</script>
